# Nationdex admin panel behind Nginx, plain HTTP. Easiest setup: LAN, a VPN, or TLS handled elsewhere.
# The panel needs none of this: it serves itself on PANEL_PORT (3000). Nginx only adds a nicer address and a front door.
#
#   sudo cp website/deploy/nginx/nationdex-panel.http.conf /etc/nginx/conf.d/nationdex-panel.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Also set PANEL_HOST=127.0.0.1 in website/.env so only Nginx can reach the panel directly.

upstream nationdex_panel {
    server 127.0.0.1:3000;     # PANEL_PORT
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;   # change me (or use `_` for any name)

    client_max_body_size 25m;        # nation art and card uploads

    location / {
        proxy_pass http://nationdex_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
