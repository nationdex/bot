# Nationdex admin panel behind Nginx with HTTPS. Optional: the panel serves itself on PANEL_PORT (3000).
# HTTPS also lets browsers use Brotli and install the panel as an app (PWA) away from localhost.
#
#   1. Point panel.example.com at this machine, change the name below (3 places) and the certificate paths.
#   2. Get a certificate:  sudo certbot certonly --webroot -w /var/www/certbot -d panel.example.com
#      (or `sudo certbot --nginx -d panel.example.com`, which edits this file for you)
#   3. sudo cp website/deploy/nginx/nationdex-panel.conf /etc/nginx/conf.d/nationdex-panel.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# Set PANEL_HOST=127.0.0.1 in website/.env so only Nginx can reach the panel directly.
# Needs Nginx 1.25.1 or newer for `http2 on;` (older: write `listen 443 ssl http2;` and delete that line).

upstream nationdex_panel {
    server 127.0.0.1:3000;     # PANEL_PORT
    keepalive 16;
}

# Brute-force brake for the sign-in form: 10 tries a minute per address.
limit_req_zone $binary_remote_addr zone=nationdex_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # HTTP/3 (needs an Nginx built with QUIC): uncomment these two lines.
    # listen 443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nationdex_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The panel itself sends the CSP, nosniff, framing and referrer headers, so they are not repeated here.

    client_max_body_size 25m;        # nation art and card uploads

    # The panel already sends Brotli/gzip and cache headers; Nginx passes them through untouched.
    location = /api/auth/login {
        limit_req zone=nationdex_login burst=5 nodelay;
        proxy_pass http://nationdex_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nationdex_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # the panel sets the Secure cookie flag from this
        proxy_read_timeout 30s;
    }
}
