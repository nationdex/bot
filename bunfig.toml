[install]
# Optional deps (e.g. @napi-rs/canvas platform binaries) must install.
optional = true

# Bun 1.4.4+ provides the formatter. Keep generated files out of its scope.
[fmt]
printWidth = 120
tabWidth = 2
singleQuote = true
semi = true
ignorePatterns = [
  "*",
  "!src/",
  "!website/",
  "src/**",
  "!src/scripts/",
  "!src/scripts/**/",
  "!src/scripts/**/*.ts",
  "website/**",
  "!website/**/",
  "!website/**/*.ts",
  "!website/**/*.tsx",
  "!website/**/*.js",
  "!website/**/*.jsx",
  "!website/**/*.css",
  "!website/**/*.scss",
  "!website/**/*.html",
  "!website/**/*.json",
  "!website/**/*.yaml",
  "!website/**/*.yml",
  "!website/**/*.md",
  "!website/*.html",
  "!*.json",
  "!*.md",
  "!*.yaml",
  "!*.yml",
  "!*.toml",
  "/src/bundle-imports.ts",
]

# Used by Bun releases that include the native JavaScript/TypeScript linter.
[lint]
ignorePatterns = ["/src/bundle-imports.ts", "/website/dist/", "/assets/", "/binaries/"]
